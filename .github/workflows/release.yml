---
name: release
# Tags the next semver version from the Conventional Commits since the last
# `vX.Y.Z` tag and creates a GitHub Release, see
# https://github.com/schubergphilis/mcvs-general-action/blob/main/docs/auto-release.md
#
# The tag is created with GITHUB_TOKEN, which starts no workflow, so docker.yml
# does not run for it on its own and is dispatched on the new tag instead.
# mcvs-docker-action only pushes the image on a `push` event, so that dispatched
# run builds and scans but does not publish until the action also pushes for a
# dispatched tag ref.
"on":
  push:
    branches:
      - main
concurrency:
  cancel-in-progress: false
  group: release
permissions:
  contents: read
jobs:
  mcvs-general-action:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # yamllint disable rule:line-length
      - id: release
        uses: schubergphilis/mcvs-general-action@96298a5c109d08a0dfd9047963e01e2441421a3f # v0.11.1
        with:
          auto-release: "true"
      # Empty when nothing was released. Re-running this job does not retry a
      # failed dispatch, run `gh workflow run docker.yml --ref <tag>` instead.
      - if: steps.release.outputs.tag != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run docker.yml --ref "${TAG}"
